[package]
name = "rapido-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rapido-cli"
path = "src/main.rs"

[dependencies]
rapido-core = { workspace = true }
rapido-crypto = { workspace = true }
rapido-proto = { workspace = true }
rapido-privacy = { workspace = true }
rapido-baselines = { workspace = true }
rapido-sim = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
sha2 = { workspace = true }
num-bigint = { workspace = true }

[features]
default = []
blst-backend = ["rapido-crypto/blst-backend"]
