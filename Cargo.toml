[workspace]
resolver = "2"
members = [
    "crates/rapido-core",
    "crates/rapido-crypto",
    "crates/rapido-proto",
    "crates/rapido-privacy",
    "crates/rapido-baselines",
    "crates/rapido-sim",
    "crates/rapido-bench",
    "crates/rapido-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nurmukhametdaniyar/rapido"

[workspace.dependencies]
# --- internal ---
rapido-core = { path = "crates/rapido-core" }
rapido-crypto = { path = "crates/rapido-crypto" }
rapido-proto = { path = "crates/rapido-proto" }
rapido-privacy = { path = "crates/rapido-privacy" }
rapido-baselines = { path = "crates/rapido-baselines" }
rapido-sim = { path = "crates/rapido-sim" }

# --- primary curve backend: arkworks ---
ark-bls12-381 = { version = "0.5", features = ["curve"] }
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"

# --- secondary backend (feature-gated) ---
blstrs = "0.7"
group = "0.13"
ff = "0.13"
pairing = "0.23"

# --- baselines ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
num-bigint = { version = "0.4", features = ["rand"] }
num-integer = "0.1"
num-traits = "0.2"

# --- support ---
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
hdrhistogram = "7"
statrs = "0.17"
thiserror = "2"
toml = "0.8"
hex = "0.4"

# --- testing / bench ---
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

# Benchmark profile. `panic = "abort"` is applied to the
# `bench-abort` profile rather than `release`, because criterion's harness and
# `cargo test --release` both require unwinding.
[profile.bench-abort]
inherits = "release"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
